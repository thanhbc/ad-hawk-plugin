      shown.sort(state.sort === "money" ? function (x, y) { return (y.money === null ? -Infinity : y.money) - (x.money === null ? -Infinity : x.money) || SEV[y.severity] - SEV[x.severity]; } : function (x, y) { return SEV[y.severity] - SEV[x.severity] || (y.money || 0) - (x.money || 0); });
      if (!shown.length) ul.appendChild(el("li", "ah-meta", a.findings.length ? "No finding matches these filters." : "No failed findings in this run."));
      shown.forEach(function (f) { ul.appendChild(findingItem(f, a, rows)); });
    }
    redraw(); add(list, controls, ul); v.appendChild(list);

    if (a.rules.length) {
      var rs = section("Rule results", count.pass + " pass \u00b7 " + count.fail + " fail \u00b7 " + count.unknown + " unknown \u00b7 " + count.not_applicable + " not applicable");
      var stack = el("div", "ah-stack"), legend = el("div", "ah-legend"), total = a.rules.length;
      ["pass", "fail", "unknown", "not_applicable"].forEach(function (k) {
        if (!count[k]) return; var s = el("div", ""); s.style.width = (count[k] / total * 100) + "%"; s.style.background = STATUS_COLOR[k]; stack.appendChild(s);
        var sw = el("span", "ah-sw"); sw.style.background = STATUS_COLOR[k]; add(legend, add(el("span", ""), sw, document.createTextNode(STATUS[k] + " " + count[k])));
      });
      var grid = el("ul", "ah-rules");
      a.rules.forEach(function (r) {
        var li = el("li", ""), b = el("button", "ah-rule ah-rule-" + (r.status === "not_applicable" ? "na" : r.status), null); b.type = "button";
        add(b, el("span", "ah-meta", r.id), el("span", "", r.name || r.id), el("span", "ah-rule-state", STATUS[r.status] + (r.failed ? " \u00b7 " + r.failed + " failed" : "")), r.reasons.length ? el("span", "ah-meta", "Why? " + r.reasons.length + " note" + (r.reasons.length > 1 ? "s" : "")) : null);
        li.appendChild(b); grid.appendChild(li);
        if (r.reasons.length) {

      });
      add(rs, stack, legend, grid); v.appendChild(rs);
    }

    if (a.learning || a.checks.length) {
      var bp = section("Best-practice checks", "not rule results; never counted above");
      if (a.learning) {
        bp.appendChild(el("p", "", "Meta learning volume: Meta says an ad set needs about 50 optimisation events a week to leave learning. These ad sets had 1 to 49 conversions in the last 7 days. This is a proxy: confirm \"Learning limited\" in the Delivery column. Ad sets with traffic, awareness or engagement goals are not expected to reach 50 and can be ignored." + (a.learning.truncated ? " Only the top ad sets by spend were checked." : "")));
        if (a.learning.rows.length) {
          var t = el("table", "ah-table"), hr = el("tr", "");
          ["Ad set", "Conversions (7 days)", "Spend"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
          add(t, add(el("thead", ""), hr));
          var tb = el("tbody", ""); a.learning.rows.forEach(function (r) { add(tb, add(el("tr", ""), el("td", "", r.name), el("td", "", fmt(r.conversions)), el("td", "", money(r.spend, a.currency)))); });
          t.appendChild(tb); add(bp, add(el("div", "ah-scroll"), t));
        } else bp.appendChild(el("p", "ah-meta", "No ad set is in that range."));
        add(bp, link("https://en-gb.facebook.com/business/help/269269737396981", "Meta: about the learning phase"));
      }
      a.checks.forEach(function (c) { add(bp, add(el("div", ""), el("strong", "", c.title), el("p", "", c.text), link(c.link))); });
      v.appendChild(bp);
    }

    if (a.changes.length) {
      var ch = section("Changes most worth making", "you make them in Ads Manager or Google Ads"), ol = el("ol", "ah-ol");
      a.changes.forEach(function (c) { ol.appendChild(el("li", "", (c.ruleId ? c.ruleId + ": " : "") + c.text)); });
      add(ch, ol); v.appendChild(ch);
    }
    return v;
  }

  function evidenceChart(f, rows, cur) {
    var ctr = f.ruleId === "R15", ns = "http://www.w3.org/2000/svg", W = 620, H = 150, L = 8, B = 22, T = 18, vals = [];
    rows.forEach(function (r) { r = r || {}; vals.push(ctr ? (num(r.impressions) > 0 && num(r.clicks) !== null ? r.clicks / r.impressions : null) : num(r.spend)); });
    var max = Math.max.apply(null, vals.filter(function (v) { return v !== null; }).concat([0]));
    if (!(max > 0)) return null;
    var label = ctr ? "Daily CTR (clicks / impressions), peak " + (max * 100).toFixed(2) + "%" : "Daily spend in " + cur + ", peak " + money(max, cur);
    var svg = document.createElementNS(ns, "svg"), n = rows.length, step = (W - L * 2) / n, ph = H - B - T, first = str(rows[0] && rows[0].date, 10), last = str(rows[n - 1] && rows[n - 1].date, 10);
    function mk(tag, attrs) { var e = document.createElementNS(ns, tag); Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); svg.appendChild(e); return e; }
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("class", "ah-chart"); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", label + ", " + n + " days, " + first + " to " + last + (vals.indexOf(null) >= 0 ? ", days without impressions are gaps" : ""));
    mk("text", { x: L, y: 12 }).textContent = label;
    mk("line", { x1: L, y1: T + ph, x2: W - L, y2: T + ph });
    vals.forEach(function (v, i) { if (v === null) return; var h = Math.max(1, v / max * ph); mk("rect", { x: L + i * step + step * 0.15, y: T + ph - h, width: Math.max(1, step * 0.7), height: h }); });
    mk("text", { x: L, y: H - 6 }).textContent = first;
    mk("text", { x: W - L, y: H - 6, "text-anchor": "end" }).textContent = last;
    return svg;
  }

  function findingItem(f, a, rows) {
    var li = el("li", "ah-item"), head = el("button", "ah-item-head", null); head.type = "button";
    var body = add(el("span", "ah-item-body"), el("span", "ah-item-title", (f.ruleId ? f.ruleId + " \u00b7 " : "") + (f.rule || "Rule")), el("span", "ah-meta", [f.object || "(no name)", f.level].filter(Boolean).join(" \u00b7 ")));
    add(head, sev(f.severity), body, el("span", "ah-money", money(f.money, a.currency)));
    var d = el("div", "ah-detail");
    var facts = el("div", "ah-facts");
    [["Metric", f.metric || "\u2013"], ["Observed", fmt(f.observed)], ["Threshold", fmt(f.threshold)], ["Period", f.period || "\u2013"]].forEach(function (x) { add(facts, add(el("div", "ah-fact"), el("span", "", x[0]), el("b", "", x[1]))); });
    d.appendChild(facts);
    if (f.advice) d.appendChild(el("p", "", f.advice));
    add(d, link(f.link));
    if (f.evidence && f.evidence.length) {
      var t = el("table", "ah-table"), hr = el("tr", "");
      ["Date", "Spend", "Impressions", "Clicks", "Conversions"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
      add(t, add(el("thead", ""), hr)); var tb = el("tbody", "");
      f.evidence.forEach(function (r) { r = r || {}; add(tb, add(el("tr", ""), el("td", "", str(r.date, 10)), el("td", "", fmt(r.spend)), el("td", "", fmt(r.impressions)), el("td", "", fmt(r.clicks)), el("td", "", fmt(r.conversions)))); });
      t.appendChild(tb); add(d, el("strong", "", "Evidence (daily rows)"), evidenceChart(f, f.evidence, a.currency), add(el("details", ""), el("summary", "", "Show daily rows"), add(el("div", "ah-scroll"), t)));
    } else d.appendChild(el("p", "ah-meta", f.evidence ? "This rule stores no daily evidence rows." : "Evidence not loaded here. Ask for this finding's details."));
    if (typeof window.sendPrompt === "function" && f.ruleId) {
      var ask = el("button", "ah-link-btn", "Ask Claude to explain this finding"); ask.type = "button";
      ask.addEventListener("click", function () { window.sendPrompt("Explain the ad-hawk " + f.ruleId + " finding" + (f.findingId ? " " + f.findingId : "") + " in more detail, with its evidence and what to check."); });
      d.appendChild(ask);
    }
    li.appendChild(head); li.appendChild(d); toggle(head, d);
    rows[f.i] = function () { if (d.hidden) head.click(); head.scrollIntoView({ behavior: "smooth", block: "center" }); head.focus(); };
    return li;
  }

  var roots = document.querySelectorAll(".ah-root");
  for (var r = 0; r < roots.length; r++) {
    var root = roots[r], src = root.querySelector("script.ah-data");
    if (!src || root.getAttribute("data-ah-done")) continue;
    root.setAttribute("data-ah-done", "1");
    try { render(root, JSON.parse(src.textContent)); }
    catch (e) { root.querySelector(".ah-app").appendChild(el("div", "ah-notice", "The audit data could not be read, so the view is empty. The text summary below has the results.")); }
  }
})();
